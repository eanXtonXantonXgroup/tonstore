<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TonStore - Unduh File Berguna Anda</title>
<meta name="description" content="TonStore adalah tempat pengundugan file-file yang mungkin berguna untuk anda">
<link rel="icon" href="icon1.png">
<style>
:root{--b:#1d6ff2;--b2:#2fb7ff;--t:#1b2a4a;--m:#64748b}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 system-ui,sans-serif;color:var(--t);background:linear-gradient(#cfe7ff,#f6faff 45%) fixed;min-height:100vh}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#fff;position:sticky;top:0;z-index:5;box-shadow:0 1px 10px #1d6ff226}
.logo{width:36px;height:36px;border-radius:9px;object-fit:cover;aspect-ratio:1}
header b{flex:1;font-size:18px;font-style:italic;color:var(--b)}
.btn{display:inline-block;border:0;border-radius:99px;padding:10px 16px;font:700 14px inherit;color:#fff;background:linear-gradient(90deg,var(--b),var(--b2));cursor:pointer;text-decoration:none;text-align:center}
.btn:disabled{opacity:.35;cursor:not-allowed}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid #dbe5f3;background:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.ib i{display:block;width:18px;height:2px;background:var(--b);box-shadow:0 6px var(--b),0 -6px var(--b)}
.chip{font-weight:700;background:#eef5ff;border-radius:99px;padding:8px 12px}
main{max-width:720px;margin:auto;padding:14px}
.ban{width:100%;aspect-ratio:2/1;object-fit:cover;border-radius:22px;display:block;background:#bcdcff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.c{background:#fff;border-radius:18px;padding:12px 6px;text-align:center;font-size:12px;color:var(--m);box-shadow:0 2px 12px #1d6ff218;min-height:112px;overflow:hidden}
.c b{display:block;font-size:15px;color:var(--t);word-break:break-all}
.c .n{font-size:24px;color:var(--b);margin-top:8px}
.av{position:relative;width:48px;height:48px;margin:12px auto 4px;border-radius:50%;background:#e6eef9;display:grid;place-items:center;font-size:22px;opacity:1}
.av span{opacity:.3}.av img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.cr{position:absolute;top:-13px;left:12px;width:24px;height:24px}
h2{font-size:16px;margin:18px 2px 10px}
.it{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:12px;margin-bottom:10px;box-shadow:0 2px 12px #1d6ff218;cursor:pointer}
.it img{width:52px;height:52px;border-radius:12px;object-fit:cover;background:#e6eef9;flex:none}
.it div{flex:1;min-width:0}.it b{display:block}.it small{color:var(--m)}
.pr{font-weight:700;color:var(--b);white-space:nowrap}
.ov{position:fixed;inset:0;background:#0a1b3d99;display:none;place-items:center;z-index:9}
.ov.on{display:grid}
.md{background:#fff;border-radius:22px;padding:18px;width:min(92%,380px);max-height:90vh;overflow:auto}
#dw{place-items:stretch end}.dr{height:100%;max-height:none;border-radius:22px 0 0 22px;width:min(86%,320px);display:flex;flex-direction:column;gap:8px}
input{width:100%;padding:11px;border:1px solid #cfdcf0;border-radius:12px;font:inherit}
.s{color:var(--m);font-size:13px;margin:4px 0}
.pf{display:flex;align-items:center;gap:10px}.pf .av{margin:0;flex:none}
.wa{display:flex;align-items:center;gap:10px;color:var(--t);text-decoration:none;font-weight:700;padding:10px 0}
.cd{text-align:center;font-weight:700;color:var(--b);padding:14px}
.md .btn{width:100%;margin-top:8px}
.top{display:flex;gap:12px;align-items:center}.top img{width:64px;height:64px;border-radius:16px;object-fit:cover}
a{color:var(--b)}
</style></head><body>
<header>
 <img class="logo" src="icon1.png" alt="" onerror="this.style.visibility='hidden'">
 <b>TonStoreFiles</b><span id="hb"></span>
 <button class="ib" data-a="menu" aria-label="Menu"><i></i></button>
</header>
<main>
 <img class="ban" src="banner.png" alt="" onerror="this.style.visibility='hidden'">
 <div class="grid">
  <div class="c">Top Buyer<div id="tb"></div></div>
  <div class="c">Total Download<b class="n" id="td">0</b>file</div>
  <div class="c">Update<b class="n">V1.0</b>versi website</div>
 </div>
 <h2>File tersedia</h2><div id="fl"><p class="s">Memuat…</p></div>
</main>

<div class="ov" id="lg"><div class="md">
 <h3 id="lt"></h3>
 <input id="un" placeholder="Username" autocapitalize="none" autocomplete="username">
 <input id="pw" type="password" placeholder="Password (min. 6 karakter)" style="margin-top:8px" autocomplete="current-password">
 <label id="icl" class="s" style="display:block;margin-top:8px">Foto profil (opsional)<input id="ic" type="file" accept="image/*"></label>
 <button class="btn" data-a="go" id="go"></button>
 <p class="s" id="lm"></p><p class="s"><a href="#" data-a="sw" id="sw"></a></p>
</div></div>

<div class="ov" id="dw"><div class="md dr"><div id="dc"></div></div></div>
<div class="ov" id="mo"><div class="md" id="mb"></div></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAnalytics}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";
import{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,updateDoc,writeBatch,increment,collection,query,orderBy,limit,getDocs,onSnapshot}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp({apiKey:"AIzaSyAqNKZlftjlnPut-gQZl3NWFu-tszD5Z2U",authDomain:"storeku-374e4.firebaseapp.com",projectId:"storeku-374e4",storageBucket:"storeku-374e4.firebasestorage.app",messagingSenderId:"660780034785",appId:"1:660780034785:web:c58e800aeecb61af11a5a0",measurementId:"G-6TRPVWN17N"});
try{getAnalytics(app)}catch(e){}
const auth=getAuth(app),db=getFirestore(app),EM="@tonstore.app";
const $=s=>document.querySelector(s);
const COIN='<svg width="16" height="16" viewBox="0 0 24 24" style="vertical-align:-3px"><circle cx="12" cy="12" r="10" fill="#f5b301" stroke="#c98a00" stroke-width="2"/><circle cx="12" cy="12" r="5.5" fill="none" stroke="#8a5a00" stroke-width="2"/></svg>';
const CROWN='<svg class="cr" viewBox="0 0 24 24"><path fill="#f5b301" stroke="#c98a00" stroke-width="1" d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/></svg>';
const WA='<svg width="28" height="28" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#25d366"/><path fill="#fff" d="M8.2 7.2c-.5.5-.9 1.200-.7 2.300.4 2.400 3.400 5.600 6.200 6.200 1 .2 1.800-.2 2.300-.8l.2-.6-2-1-.9.9c-1.300-.5-2.500-1.700-3-3l.9-.8-1-2z"/></svg>';
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
const bal=u=>u?u.coins+(u.te>Date.now()?u.tc:0):0;
const price=f=>/free/i.test(f.type_download)?0:+(/\d+/.exec(f.type_download)||[0])[0];
const av=(i,c)=>`<div class="av">${c?CROWN:""}${i?`<img src="${i}" alt="">`:"<span>👤</span>"}</div>`;
const show=s=>$(s).classList.add("on"),hide=s=>$(s).classList.remove("on");
const err=e=>({"auth/invalid-credential":"Username atau password salah","auth/email-already-in-use":"Username sudah dipakai","auth/weak-password":"Password minimal 6 karakter","permission-denied":"Ditolak oleh aturan database"}[e.code]||e.code||e.message);
let uid=null,U=null,CFG={inventory:{}},ST={},mode="in",T;

fetch("config.json").then(r=>r.json()).then(j=>{CFG=j;list()}).catch(()=>{$("#fl").innerHTML='<p class="s">config.json gagal dimuat.</p>'});
function list(){
 $("#fl").innerHTML=Object.entries(CFG.inventory).map(([id,f])=>{const p=price(f);
  return`<div class="it" data-a="item" data-id="${esc(id)}"><img src="${esc(f.icon)}" alt="" onerror="this.style.visibility='hidden'"><div><b>${esc(f.name)}</b><small>oleh ${esc(f.author)}</small></div><span class="pr">${p?COIN+" "+p:"Free"}</span></div>`}).join("")||'<p class="s">Belum ada file.</p>';
}
async function stats(){
 try{ST=(await getDoc(doc(db,"stats","dl"))).data()||{}}catch(e){}
 $("#td").textContent=ST.total||0;
 try{const t=(await getDocs(query(collection(db,"users"),orderBy("spent","desc"),limit(1)))).docs[0]?.data();
  $("#tb").innerHTML=t&&t.spent?av(t.icon,1)+`<b>${esc(t.username)}</b>${t.spent} pembelian`:'<p class="s" style="margin-top:30px">Belum ada</p>'}catch(e){}
}
stats();

onAuthStateChanged(auth,x=>{uid=x?x.uid:null;U=null;ui();if(x)onSnapshot(doc(db,"users",uid),s=>{U=s.data()||null;ui()})});
function ui(){
 $("#hb").innerHTML=uid?`<span class="chip">${COIN} ${bal(U)}</span>`:'<button class="btn" data-a="login">Masuk</button>';
 const wa=`<a class="wa" href="https://wa.me/6287785996770" target="_blank" rel="noopener">${WA} Hubungi via WhatsApp</a>`;
 $("#dc").innerHTML=(uid&&U?`<div class="pf">${av(U.icon)}<div><b>${esc(U.username)}</b><div class="s">${COIN} ${U.coins} permanen${U.te>Date.now()?`<br>+ ${U.tc} trial (sampai ${new Date(U.te).toLocaleString("id-ID")})`:""}</div></div></div>
 <h3 style="margin:14px 0 4px">Tukar kode</h3><input id="vc" placeholder="Kode 7 digit" maxlength="7" inputmode="numeric"><button class="btn" style="width:100%;margin-top:8px" data-a="redeem">Tukar jadi coin</button><p class="s" id="vm"></p>`
 :'<p class="s">Masuk atau daftar untuk menukar kode dan membeli file.</p><button class="btn" style="width:100%" data-a="login">Masuk / Daftar</button>')+wa+(uid?'<button class="btn" style="width:100%;background:#64748b" data-a="out">Keluar</button>':"");
}

function loginUI(){
 $("#lt").textContent=mode=="in"?"Masuk":"Daftar akun";$("#go").textContent=mode=="in"?"Masuk":"Daftar";
 $("#icl").style.display=mode=="in"?"none":"block";$("#sw").textContent=mode=="in"?"Belum punya akun? Daftar":"Sudah punya akun? Masuk";$("#lm").textContent="";show("#lg");
}
const ico=()=>new Promise(r=>{const f=$("#ic").files[0];if(!f)return r("");const i=new Image();i.onload=()=>{const c=document.createElement("canvas");c.width=c.height=96;const s=Math.min(i.width,i.height);c.getContext("2d").drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,96,96);r(c.toDataURL("image/jpeg",.8))};i.onerror=()=>r("");i.src=URL.createObjectURL(f)});
async function go(){
 const n=$("#un").value.trim().toLowerCase(),p=$("#pw").value,m=$("#lm");
 if(!/^[a-z0-9_]{3,16}$/.test(n))return m.textContent="Username 3–16 karakter: huruf, angka, atau _";
 m.textContent="Memproses…";
 try{
  if(mode=="in")await signInWithEmailAndPassword(auth,n+EM,p);
  else{const r=await createUserWithEmailAndPassword(auth,n+EM,p);await setDoc(doc(db,"users",r.user.uid),{username:n,icon:await ico(),coins:0,tc:0,te:0,spent:0,buys:{}})}
  hide("#lg");
 }catch(e){m.textContent=err(e)}
}
async function redeem(){
 const code=$("#vc").value.trim(),m=$("#vm");
 try{
  const vr=doc(db,"vouchers",code),vs=await getDoc(vr);
  if(!vs.exists()||vs.data().used)return m.textContent="Kode tidak valid atau sudah dipakai.";
  const v=vs.data(),b=writeBatch(db),now=Date.now(),ur=doc(db,"users",uid);
  b.update(vr,{used:true,usedBy:uid});
  if(v.perm)b.update(ur,{coins:U.coins+v.coins,lastVc:code});
  else{const act=U.te>now,ne=now+v.hours*36e5;b.update(ur,{tc:(act?U.tc:0)+v.coins,te:act&&U.te>ne?U.te:ne,lastVc:code})}
  await b.commit();$("#vm").textContent="Berhasil! +"+v.coins+" coin"+(v.perm?"":" (trial "+v.hours+" jam)");
 }catch(e){m.textContent=err(e)}
}

function openItem(id){
 const f=CFG.inventory[id],bought=U&&U.buys&&U.buys[id];
 $("#mb").innerHTML=`<div class="top"><img src="${esc(f.icon)}" alt="" onerror="this.style.visibility='hidden'"><div><b>${esc(f.name)}</b><div class="s">oleh ${esc(f.author)}</div></div></div><p>${esc(f.deskripsi)}</p><p class="s">Diunduh ${ST["f"+id]||0} kali</p><div id="ma"></div><button class="btn" style="background:#64748b" data-a="close">Tutup</button>`;
 show("#mo");clearInterval(T);let n=bought?0:15;
 const tick=()=>{if(n<=0){clearInterval(T);return act(id)}$("#ma").innerHTML=`<div class="cd">Tunggu ${n} detik…</div>`;n--};
 tick();T=setInterval(tick,1000);
}
function act(id){
 const f=CFG.inventory[id],p=price(f),box=$("#ma");if(!box)return;
 if(p&&!(U&&U.buys&&U.buys[id])){
  if(!uid||!U){box.innerHTML='<button class="btn" data-a="login2">Masuk untuk membeli</button>';return}
  const t=bal(U),ok=t>=p;
  box.innerHTML=`<button class="btn" id="by" ${ok?"":"disabled"}>Beli ${COIN} ${p}</button><p class="s">Coin kamu: ${t} · ${ok?"sisa setelah beli: "+(t-p):"kurang "+(p-t)+" coin"}</p>`;
  $("#by").onclick=()=>buy(id,p);
 }else{
  box.innerHTML=`<a class="btn" id="dl" href="${esc(f.path)}" target="_blank" rel="noopener" download>Download</a>`;
  $("#dl").onclick=()=>{setDoc(doc(db,"stats","dl"),{total:increment(1),["f"+id]:increment(1)},{merge:true}).catch(()=>{});ST.total=(ST.total||0)+1;ST["f"+id]=(ST["f"+id]||0)+1;$("#td").textContent=ST.total};
 }
}
async function buy(id,p){
 const t=U.te>Date.now()?Math.min(U.tc,p):0;
 try{
  await updateDoc(doc(db,"users",uid),{coins:U.coins-(p-t),tc:U.tc-t,spent:increment(1),["buys."+id]:true});
  U.buys=Object.assign({},U.buys,{[id]:true});act(id);stats();
 }catch(e){$("#ma").insertAdjacentHTML("beforeend",`<p class="s">${esc(err(e))}</p>`)}
}

const A={
 menu:()=>show("#dw"),login:()=>{hide("#dw");loginUI()},login2:()=>{hide("#mo");loginUI()},
 sw:()=>{mode=mode=="in"?"up":"in";loginUI()},go,redeem,out:()=>{signOut(auth);hide("#dw")},
 item:t=>openItem(t.dataset.id),close:()=>{clearInterval(T);hide("#mo")}
};
document.addEventListener("click",e=>{
 if(e.target.classList.contains("ov")){hide("#"+e.target.id);clearInterval(T);return}
 const t=e.target.closest("[data-a]");if(t){e.preventDefault();A[t.dataset.a](t)}
});
</script></body></html>
